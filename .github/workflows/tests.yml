name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Abhängigkeiten (nur für den PDF-Export nötig)
        run: pip install fpdf2
      - name: Testsuite
        working-directory: plugins/steuer-de/skills/steuererklaerung
        run: python3 tests/run_tests.py
